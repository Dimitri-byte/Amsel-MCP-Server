[project]
name = "amsel-mcp"
version = "0.1.0"
description = "MCP server giving Claude read and write access to Amsel Suite (Tome & Lore) tabletop RPG files"
readme = "README.md"
authors = [
    { name = "Dimitri Biard" }
]
requires-python = ">=3.10"
license = "MIT"
license-files = ["LICENSE"]
keywords = ["mcp", "model-context-protocol", "claude", "amsel", "tabletop-rpg", "ttrpg", "game-master"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: End Users/Desktop",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Topic :: Games/Entertainment :: Role-Playing",
]
dependencies = [
    "mcp>=2.3,<3",
]

[project.urls]
Homepage = "https://github.com/Dimitri-byte/Amsel-MCP-Server"
Issues = "https://github.com/Dimitri-byte/Amsel-MCP-Server/issues"
Changelog = "https://github.com/Dimitri-byte/Amsel-MCP-Server/blob/main/CHANGELOG.md"

[project.scripts]
amsel-mcp = "amsel_mcp.server:main"

[build-system]
requires = ["uv_build>=0.13.7,<0.14.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.2.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
